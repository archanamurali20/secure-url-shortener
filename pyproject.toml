[project]
name = "secure-url-shortener"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.140.8",
    "psycopg2-binary==2.9.12",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "slowapi==0.1.10",
    "sqlalchemy==2.0.52",
    "sqlmodel==0.0.39",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*", "loadtest/*"]